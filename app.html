<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="app-body">
  <!--nav bar-->
  <header class="site-header">
    <nav class="nav-bar">
      <h1 class="logo">Quote Application</h1>
      <nav class="nav-links">
        <a href="index.html">&larr; Back to Portfolio</a>
      </nav>
    </nav>
  </header>

  <!--main app--> 
  <main class="app-main">
      <div class="container app-container">
        <div class="quote-box">
          <h2>Quote of the day</h2>
          <!--display quote-->
          <div id="quoteDisplay">
            <p class="quote-text" id="quoteText">Click the button below to generate a random quote...</p>
            <p class="author" id="quoteAuthor">---DummyJson</p>
          </div>
          <!--user input-->
          <div class="input-container">
            <input type="text" id="userInput" placeholder="Search by keyword(e.g.work, life)...">
          </div>

          <button id="generateBtn">Generate new Quote></button>

          <p id="errorMsg" class="error-text"></p>
        </div>
      </div>
    </main>
  <script src="script.js"></script>
</body>
</html>
